name: Pre-match Integration Tests

on:
  push:
    branches:
      - integrate/final-prematch-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-match-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests pytest
      - name: Run integration tests
        env:
          PYTHONPATH: .
        run: pytest -q -s tests/test_prematch_integration.py
