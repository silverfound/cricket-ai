name: Update Live Data

on:
  schedule:
    - cron: '0 * * * *' # Har 1 ghante mein chalega
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # History fetch karne ke liye

    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: pip install requests pandas scikit-learn xgboost joblib
      
    - name: Fetch Data
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        SECONDARY_API_KEY: ${{ secrets.SECONDARY_API_KEY }}
        TERTIARY_API_KEY: ${{ secrets.TERTIARY_API_KEY }}
        SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      run: python fetch_data.py
      
    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add live_matches.json
        git commit -m "Auto update data" || echo "No changes"
        
        # 🔥 YEH LINE ERROR FIX KAREGI (Push se pehle pull karega)
        git pull --rebase origin main
        git push
