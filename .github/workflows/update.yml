name: Update Live Data

on:
  push:
    paths:
      - '.github/workflows/update.yml'
      - 'venue_model.py'
      - 'models/venue_aware_candidate.joblib'
      - 'data/venue_model_state.json'
  schedule:
    - cron: '0 * * * *' # Har 1 ghante mein chalega (API limit safe rakhne ke liye)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install --upgrade pip && python -m pip install requests pandas scikit-learn xgboost joblib

    - name: Verify venue-aware model artifact
      run: python -c "from venue_model import load_venue_candidate; a,s=load_venue_candidate(); assert a is not None and s is not None, 'Venue-aware candidate failed to load'; print('VENUE MODEL ACTIVE: candidate artifact and state loaded')"
    - name: Fetch Data
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        SECONDARY_API_KEY: ${{ secrets.SECONDARY_API_KEY }}
        SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      run: python fetch_data.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add live_matches.json
        git commit -m "Auto update data" || echo "No changes to commit"
        git pull --rebase origin main
        git push origin main
