name: Update Live Data

on:
  schedule:
    # Har 5 minute mein automatically chalega
    - cron: '*/5 * * * *' 
  workflow_dispatch: # Manual run ke liye

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      # 🔥 YEH SABSE ZAROORI HAI: AI model ke liye libraries install karne ke liye
      run: pip install requests pandas scikit-learn xgboost joblib
      
    - name: Fetch Data
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        SECONDARY_API_KEY: ${{ secrets.SECONDARY_API_KEY }}
        TERTIARY_API_KEY: ${{ secrets.TERTIARY_API_KEY }}
        SPORTSCORE_API_KEY: ${{ secrets.SPORTSCORE_API_KEY }}
        CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      run: python fetch_data.py
      
    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add live_matches.json
        git commit -m "Auto updated live data with AI predictions" || echo "No changes to commit"
        git push
