<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cricket Predictor</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --green: #22c55e; --gold: #fbbf24; --border: #334155; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        
        .header { text-align: center; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        .header h1 { color: var(--accent); margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        
        .refresh-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 50%; width: 35px; height: 35px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .refresh-btn:active { background: var(--accent); color: var(--bg); transform: rotate(180deg); }
        .refresh-btn.spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .header p { color: #94a3b8; font-size: 12px; margin-top: 5px; margin-bottom: 2px; }
        #api-source { color: var(--green); font-size: 11px; font-weight: bold; margin: 0; }
        
        .tabs { display: flex; background: var(--card); border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px 0; text-align: center; background: transparent; color: #94a3b8; border: none; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: var(--bg); }
        
        .match-card { background: var(--card); border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid var(--border); overflow: hidden; display: none; }
        .card-top { background: rgba(56, 189, 248, 0.1); padding: 8px 15px; font-size: 11px; color: var(--accent); display: flex; justify-content: space-between; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        
        .card-body { padding: 15px; }
        .team-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .team-info { display: flex; flex-direction: column; }
        .team-name { font-size: 16px; font-weight: 600; }
        .team-overs { font-size: 11px; color: #94a3b8; margin-top: 2px; }
        
        .score-box { text-align: right; }
        .score { font-size: 18px; font-weight: bold; color: var(--accent); }
        
        .card-bottom { padding: 0 15px 15px 15px; }
        .status { background: rgba(34, 197, 94, 0.1); color: var(--green); font-size: 12px; text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; }
        
        /* AI Predictions Box */
        .ai-box { text-align: center; padding: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; border-top: 1px solid var(--border); }
        .ai-win { background: rgba(251, 191, 36, 0.1); color: var(--gold); border-top-color: var(--gold); }
        .ai-score { background: rgba(56, 189, 248, 0.1); color: var(--accent); border-top-color: var(--accent); }
        .ai-pre { background: rgba(34, 197, 94, 0.1); color: var(--green); border-top-color: var(--green); }
        .ai-badge { padding: 4px 10px; border-radius: 20px; font-size: 14px; color: #000; }
        .badge-gold { background: var(--gold); }
        .badge-blue { background: var(--accent); }
        .badge-green { background: var(--green); }
        
        .msg-box { text-align: center; margin-top: 30px; font-size: 16px; display: none; }
        .loading { color: var(--accent); }
        .error-msg { color: #ef4444; }
        .no-match { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏏 AI Predictor <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">🔄</button></h1>
        <p id="last-updated">Loading latest matches...</p>
        <p id="api-source"></p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('live')" id="tab-live">🔴 Live</button>
        <button class="tab-btn" onclick="switchTab('upcoming')" id="tab-upcoming">⏳ Upcoming</button>
        <button class="tab-btn" onclick="switchTab('finished')" id="tab-finished">✅ Finished</button>
    </div>

    <div id="loading-text" class="msg-box loading" style="display: block;">⏳ Data aa raha hai...</div>
    <div id="error-text" class="msg-box error-msg"></div>
    <div id="matches-container"></div>

    <script>
        let allMatches = []; 
        let currentTab = 'live'; 
        let isFetching = false; 
        let autoRefreshTimer = null;

        const loadingText = document.getElementById('loading-text');
        const errorText = document.getElementById('error-text');
        const matchesContainer = document.getElementById('matches-container');
        const refreshBtn = document.getElementById('refresh-btn');

        function manualRefresh() {
            if (isFetching) return; 
            loadingText.style.display = 'block';
            errorText.style.display = 'none';
            fetchMatches(true);
        }

        async function fetchMatches(isManual = false) {
            if (isFetching) return; 
            isFetching = true;
            if (isManual) { refreshBtn.classList.add('spin'); matchesContainer.innerHTML = ''; }

            try {
                const timestamp = new Date().getTime(); 
                const response = await fetch('live_matches.json?v=' + timestamp);
                if (!response.ok) throw new Error("File not found");
                const data = await response.json();
                
                // UTC Time ko aapke phone ke local time mein convert karna
const utcDate = new Date(data.last_updated.replace(" ", "T") + "Z");
const localTime = utcDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
document.getElementById('last-updated').innerText = "Last Updated: " + localTime;
                document.getElementById('api-source').innerText = "⚡ Powered by: " + (data.data_source_api || "Unknown API");
                allMatches = data.matches; 
                
                loadingText.style.display = 'none';
                errorText.style.display = 'none';
                renderMatches(); 

            } catch (error) {
                loadingText.style.display = 'none';
                errorText.innerText = "Error: " + error.message;
                errorText.style.display = 'block';
            } finally {
                isFetching = false;
                refreshBtn.classList.remove('spin');
                clearTimeout(autoRefreshTimer);
                autoRefreshTimer = setTimeout(() => { fetchMatches(false); }, 60000); 
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            renderMatches();
        }

        function renderMatches() {
            matchesContainer.innerHTML = ''; 
            const filteredMatches = allMatches.filter(m => m.match_state === currentTab);

            if (filteredMatches.length === 0) {
                matchesContainer.innerHTML = '<div class="msg-box no-match" style="display:block;">Is category mein abhi koi match nahi hai.</div>';
                return;
            }

            filteredMatches.forEach(match => {
                const scoreHome = (match.score_home === "null" || !match.score_home) ? "-" : match.score_home;
                const scoreAway = (match.score_away === "null" || !match.score_away) ? "-" : match.score_away;
                
                let oversHomeText = match.overs_home ? `(${match.overs_home})` : "";
                let oversAwayText = match.overs_away ? `(${match.overs_away})` : "";

                let localDate = "Date TBD", localTime = "";
                if (match.start_time_iso) {
                    const dateObj = new Date(match.start_time_iso);
                    localDate = dateObj.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
                    localTime = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                }

                // 🤖 AI Predictions Logic Box
                let predictionHTML = "";
                
                if (match.match_state === "live") {
                    if (match.win_probability !== null && match.win_probability !== undefined) {
                        predictionHTML = `<div class="ai-box ai-win">🤖 AI Win Probability: <span class="ai-badge badge-gold">${match.win_probability}%</span></div>`;
                    } else if (match.projected_score) {
                        predictionHTML = `<div class="ai-box ai-score">🤖 AI Projected Score: <span class="ai-badge badge-blue">${match.projected_score}</span></div>`;
                    } else {
                        predictionHTML = `<div class="ai-box" style="color: #94a3b8; background: rgba(255,255,255,0.05);">🤖 AI: Analyzing...</div>`;
                    }
                } else if (match.match_state === "upcoming" && match.pre_match_winner) {
                    predictionHTML = `<div class="ai-box ai-pre">🤖 AI Match Winner: <span class="ai-badge badge-green">${match.pre_match_winner}</span></div>`;
                } else if (match.match_state === "upcoming") {
                    predictionHTML = `<div class="ai-box" style="color: #94a3b8; background: rgba(255,255,255,0.05);">🤖 AI: Prediction unavailable for this team</div>`;
                }

                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.display = 'block'; 
                card.innerHTML = 
                    '<div class="card-top">' +
                        '<span>' + (match.league || "Unknown") + '</span>' +
                        '<span>' + (match.format || "T20") + ' | ' + localDate + ', ' + localTime + '</span>' +
                    '</div>' +
                    '<div class="card-body">' +
                        '<div class="team-row">' +
                            '<div class="team-info">' +
                                '<span class="team-name">' + (match.home || "Home") + '</span>' +
                                '<span class="team-overs">' + oversHomeText + '</span>' +
                            '</div>' +
                            '<div class="score-box"><div class="score">' + scoreHome + '</div></div>' +
                        '</div>' +
                        '<div class="team-row">' +
                            '<div class="team-info">' +
                                '<span class="team-name">' + (match.away || "Away") + '</span>' +
                                '<span class="team-overs">' + oversAwayText + '</span>' +
                            '</div>' +
                            '<div class="score-box"><div class="score">' + scoreAway + '</div></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="card-bottom"><div class="status">' + (match.status || "Status Unknown") + '</div></div>' +
                    predictionHTML;
                
                matchesContainer.appendChild(card);
            });
        }

        fetchMatches(false); 
    </script>
</body>
</html>
